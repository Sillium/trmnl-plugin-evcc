# TRMNL EVCC Collector
# Builds the image from this checkout — no registry involved.
#
#   docker compose up -d --build
#
# Run from this directory (collector/) so the build context and the
# config.yaml bind mount resolve correctly.
services:
  trmnl-evcc-collector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trmnl-evcc-collector
    restart: unless-stopped
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    environment:
      - TZ=Europe/Berlin
    # Uncomment for Terminus/BYOS HTTP serve mode:
    # environment:
    #   - SERVE_PORT=8080
    # ports:
    #   - "8080:8080"
